# Racine du workspace : `src-tauri` reste le paquet principal, et les crates de
# l'aperçu 3D (docs/SPEC-preview-3d-kn5.md §5.1) vivent sous `crates/`. Le
# workspace est ici plutôt qu'à la racine du dépôt pour que `target/`, le
# `Cargo.lock` et les invocations `cargo` de la CI restent exactement où ils
# étaient — un workspace à la racine du dépôt aurait déplacé tout ça.
[workspace]
members = ["crates/*"]
resolver = "2"

# En développement, **les dépendances sont optimisées, pas le code de l'app**.
#
# Mesuré sur `ks_toyota_supra_mkiv` : la conversion d'un aperçu 3D prenait
# 5,5 s sous `tauri dev` contre 0,4 s en release — un facteur 13, entièrement
# imputable au décodage et au ré-encodage des textures, qui passent leur temps
# dans `image`, `image_dds` et `rayon`. Les optimiser rend l'aperçu utilisable
# en développement sans toucher à la lisibilité des piles d'appel du code de
# Pit Box, qui reste en `opt-level = 0`.
#
# Coût : la première compilation après un `cargo clean` est plus longue. Elles
# ne se recompilent ensuite qu'à un changement de version.
[profile.dev.package."*"]
opt-level = 2

# Les crates de l'aperçu sont du calcul pur, elles aussi : un parser binaire et
# un transcodeur d'images. Les garder non optimisées annulerait l'essentiel du
# gain ci-dessus, et on n'y pose pas de point d'arrêt au quotidien.
[profile.dev.package.kn5]
opt-level = 2

[profile.dev.package.kn5-gltf]
opt-level = 2

[package]
name = "pitbox"
version = "0.3.0"
description = "Pit Box — gestionnaire de mods Assetto Corsa"
authors = ["Theo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
dirs = "5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-log = "2"
log = "0.4"
# Moteur audio du mode Big Picture (docs/spec-module-musique_2.md) : décodeurs
# mp3/flac/vorbis/wav inclus par défaut, sortie via cpal (WASAPI partagé sous
# Windows — jamais le mode exclusif, qui couperait le son d'Assetto Corsa).
rodio = "0.19"
# Détection du lancement d'AC (acs.exe / AssettoCorsa.exe) par polling léger,
# plus simple qu'un ManagementEventWatcher WMI (§4 de la spec musique).
sysinfo = "0.32"
# Permutation Fisher-Yates des playlists (§5.4) : zéro dépendance transitive,
# bien plus léger que `rand` pour un seul besoin de mélange.
fastrand = "2"
# Miniatures des galeries médias (§6.1) : les captures AC sont en pleine
# résolution jeu, jamais retaillées jusqu'ici — décodage/redimensionnement
# jpeg+png seulement (pas les formats exotiques, inutiles ici).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Mise à la corbeille d'un screenshot/replay depuis la fiche (§6.1). Passe par
# `IFileOperation` + `FOFX_RECYCLEONDELETE`, qui **échoue** quand le recyclage
# est impossible (partage réseau, fichier plus gros que le quota de la
# corbeille) — là où le `SHFileOperationW`/`FOF_ALLOWUNDO` qu'on écrirait à la
# main bascule silencieusement en suppression définitive dans exactement ces
# cas-là. C'est ce que cette dépendance achète : pas la commodité.
trash = "5"
# Aperçu 3D natif des voitures (docs/SPEC-preview-3d-kn5.md) : parsing du
# format KN5 et conversion en glTF, tous deux dans `crates/`.
kn5 = { path = "crates/kn5" }
kn5-gltf = { path = "crates/kn5-gltf" }

# Lecture registre Windows uniquement (détection du Mode développeur, §12) —
# déjà présent transitivement via tauri, pas une dépendance de plus en pratique.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Lecture de la mémoire partagée exportée par acs.exe (`Local\acpmf_graphics`,
# §16.4 du SPEC) pour détecter la fin du chargement de session — déjà présente
# transitivement (winreg 0.55 en dépend), pas une dépendance de plus en pratique.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    # Espace libre du volume de la bibliothèque avant un import en lot (§4.2bis) :
    # refuser un lot qui ne peut pas tenir coûte moins cher que le nettoyage
    # d'un import mort à mi-parcours.
    "Win32_Storage_FileSystem",
] }
