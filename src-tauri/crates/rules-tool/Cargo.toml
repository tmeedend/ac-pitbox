[package]
name = "rules-tool"
version = "0.1.0"
edition = "2021"
description = "Developer CLI for the rules catalogue shipped with Pit Box — not shipped to users"
license = "MIT"
publish = false

[dependencies]
pitbox-catalog = { path = "../catalog" }
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }

# `raw_value` lets `_meta` pass through untouched (`lists.rs`). Never
# `preserve_order`: it would reach the whole workspace build and change the
# key order `content()` - hence every fingerprint - depends on.
# Aucune autre dépendance : deux sous-commandes et deux options tiennent en
# quelques lignes, comme pour `kn5-tool`.
