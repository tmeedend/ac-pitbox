[package]
name = "pitbox-catalog"
version = "0.1.0"
edition = "2021"
description = "Pit Box rules catalogue in two layers - what the application ships, and the user's decisions on top"
license = "MIT"

# Pure data and merge logic, shared by the application and by `rules-tool`:
# ONE implementation of the merge, so what the tool promotes into the
# catalogue is exactly what the application applied.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
