id: ch02
title: Chapter 2
nodes:
  # A new phone: the smartphone's apps, the news shown at once.
  - id: chapter_2
    beat: { frame: smartphone, unlock: [news], status: { battery: 64 } }
  - id: season_opens
    side_events: { open: [track_day_01] }
  - id: money_check
    branch:
      - if: ["money >= 100"]
        goto: race_02
    otherwise: short_of_money
  - id: short_of_money
    message: broke_01
  - id: earn
    action: check_funds
    next: money_check
  - id: after_defeat
    beat: { effects: ["rel.rival += 1"] }
    next: money_check
  # Last of the chapter: a success goes on to the next one.
  - id: race_02
    event: race_02
    on_failure: after_defeat
