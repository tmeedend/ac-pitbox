# A chapter with no frame: the story plays on the scene only, like a visual
# novel. A race is launched from the scene, and what only the phone can show
# waits for the phone to come back.
id: ch03
title: Chapter 3
nodes:
  - id: face_to_face
    beat: { frame: none, scene: bedroom, clock: "21:30" }
  - id: talk
    message: talk_01
    on_reply: { another: keen, rest: resting }
  - id: keen
    beat: { effects: ["reputation += 1"], scene: garage, mood: tense }
    next: race_03
  - id: resting
    beat: { effects: ["rel.parent += 1"] }
  - id: race_03
    event: race_03
  - id: crossing_the_line
    message: finish_line
  # No phone in this chapter: the paper, the TV and the landline play on the
  # scene, as do a letter and a dialogue.
  - id: next_morning
    message: race_report
  - id: evening_news
    message: tv_report
  - id: a_letter
    message: sponsor_letter
  - id: home_rings
    message: parent_call
    wait_reply: true
  - id: a_week_later
    # A week later, the garage by day whatever the clock says.
    beat: { advance: 1 week, mood: none, scene: garage, variant: day }
  - id: phone_back
    # Back home after the race: the battery almost flat, the messages in
    # their night look.
    beat: { frame: smartphone, scene: bedroom, status: { battery: 9, wifi: false }, skins: { messages: chat_night } }
  - id: finale
    side_events: { close: [track_day_01] }
  - id: the_end
    end: finished
