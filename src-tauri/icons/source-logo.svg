<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Reprend le logo de l'app (AppShell .logo) : parallélogramme rouge aux
       bords verticaux penchés (skewX -8°) + « PB » blanc italique, fond
       transparent (pas un carré plein). -->
  <g transform="translate(256,256) skewX(-8) translate(-256,-256)">
    <rect x="96" y="96" width="320" height="320" fill="#d40000"/>
  </g>
  <text x="256" y="270" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="800" font-style="italic"
        font-size="200" letter-spacing="-6" fill="#ffffff">PB</text>
</svg>
