<!doctype html>
<html lang="en" style="background: #08080c">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pit Box</title>
    <!-- The boot screen (SPEC §13, `src/lib/shell/boot.ts`): plain HTML and
         inline CSS, because it has to be there before any script or the global
         stylesheet - that is the whole point of it. The colours fall back on
         the tokens' own values for the same reason. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: var(--bg, #08080c);
        transition: opacity 0.25s ease-out;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-mark {
        width: 46px;
        height: 46px;
        background: var(--rosso, #d40000);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: skewX(-8deg);
        pointer-events: none;
      }
      #boot .boot-mark span {
        transform: skewX(8deg);
        color: #fff;
        font: italic 700 18px "Segoe UI", sans-serif;
      }
      #boot .boot-bar {
        width: 120px;
        height: 2px;
        overflow: hidden;
        background: rgb(255 255 255 / 8%);
        pointer-events: none;
      }
      #boot .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: var(--rosso, #d40000);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar i {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- A drag region: the window has no frame, and the title bar is not drawn
         yet - a slow start must not leave a window that cannot be moved. -->
    <div id="boot" data-tauri-drag-region aria-hidden="true">
      <div class="boot-mark"><span>PB</span></div>
      <div class="boot-bar"><i></i></div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
