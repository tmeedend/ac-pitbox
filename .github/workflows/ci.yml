name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche : un nouveau push annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # svelte-check doit rester à 0 erreur (des warnings
      # state_referenced_locally préexistants sont attendus).
      - name: svelte-check
        run: npm run check

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend (clippy + tests)
    # Windows obligatoire : les tests créent de vraies junctions et hardlinks
    # (mklink /J), et l'app ne cible que Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `tauri-build` (build.rs) exige que `frontendDist` (../build) existe,
      # même pour un simple `cargo test` : le front doit être construit avant.
      - run: npm ci
      - run: npm run build

      # `--all`/`--workspace` obligatoires depuis l'ajout des crates de
      # l'aperçu 3D (src-tauri/crates/) : sans ça, cargo ne regarde que le
      # paquet racine du workspace et les crates ne sont ni vérifiés ni testés.
      # Style figé par src-tauri/rustfmt.toml (max_width = 120).
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy (warnings = erreurs)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace

  bundle:
    name: Bundle (installateur)
    runs-on: windows-latest
    # Vérifie que l'app s'empaquette réellement. Ne publie rien : la
    # distribution signée passe par release.yml, sur tag.
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `tauri build` enchaîne lui-même `beforeBuildCommand` (npm run build),
      # puis `bundle` zippe l'installateur comme le fera release.yml : le zip
      # d'OverTake est ainsi éprouvé avant qu'un tag ne dépende de lui.
      - name: Build installateur (non signé)
        run: npm run bundle

      # v7 : la v4 ciblait Node 20, que les runners forcent désormais sur
      # Node 24 avec un avertissement de dépréciation. La v5 ne suffisait pas —
      # elle ne fait que *supporter* Node 24, elle tourne encore sur Node 20 par
      # défaut ; c'est la v6 qui bascule, et la v7 y ajoute l'ESM. `path`,
      # `if-no-files-found` et `retention-days` n'ont pas changé de sens depuis
      # la v4. La borne de
      # version de runner qu'exige la v7 ne concerne que l'auto-hébergé.
      #
      # Seul le zip part : il contient déjà l'installateur, et le joindre à côté
      # doublait le poids de chaque artefact. `archive: false` le dépose tel
      # quel — sans lui, GitHub l'enveloppe dans un second zip au
      # téléchargement. Dans ce mode l'artefact prend le nom du fichier
      # (`Pit.Box_<version>_x64-setup.zip`) et un seul fichier est admis :
      # un runner neuf n'en produit qu'un.
      - uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/nsis/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
