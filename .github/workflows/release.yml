name: Release

# Publie les installateurs Windows sur un tag `v*` (ex. `v0.2.0`).
# La release est créée en BROUILLON : on vérifie les binaires avant de publier.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --- Signature Authenticode -------------------------------------------
      # La signature passe par `bundle.windows.signCommand` de Tauri, PAS par une
      # étape qui signerait les fichiers après coup. Deux raisons :
      #
      #  1. Tauri appelle la commande **pendant** l'empaquetage, donc
      #     l'exécutable *à l'intérieur* de l'installateur est signé lui aussi —
      #     signer seulement le .msi/.exe final laisserait le binaire installé
      #     non signé, et SmartScreen le verrait au premier lancement.
      #  2. `tauri-action` construit ET publie la release en une seule étape :
      #     il n'existe pas de fenêtre entre « bundles produits » et « bundles
      #     téléversés » où une étape de signature pourrait s'intercaler.
      #
      # Reste inactif tant que la variable de dépôt SIGN_COMMAND est vide : le
      # build produit alors des binaires NON signés (SmartScreen affichera
      # « Éditeur inconnu »), sans faire échouer le workflow.
      #
      # SIGN_COMMAND est volontairement agnostique du fournisseur — Azure
      # Trusted Signing, SignPath ou signtool local. Tauri y remplace %1 par le
      # chemin du fichier à signer. Voir docs/windows-code-signing.md.
      - name: Activer la signature (si configurée)
        if: vars.SIGN_COMMAND != ''
        shell: pwsh
        env:
          SIGN_COMMAND: ${{ vars.SIGN_COMMAND }}
        run: |
          # tauri.conf.json est du JSON strict (pas de commentaire possible) :
          # la clé est injectée ici plutôt que laissée en place désactivée.
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $conf.bundle.PSObject.Properties['windows']) {
            $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{})
          }
          $conf.bundle.windows | Add-Member -NotePropertyName signCommand `
            -NotePropertyValue $env:SIGN_COMMAND -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          Write-Host "Signature activée."

      - name: Build + release brouillon
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pit Box ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
